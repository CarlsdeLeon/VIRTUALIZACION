apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring-celc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-monitoring-celc
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-monitoring-celc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail-monitoring-celc
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring-celc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring-celc
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.monitoring-celc.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-logs
        # El runtime del nodo es containerd: los logs usan el formato CRI.
        pipeline_stages:
          - cri: {}
        static_configs:
          - targets: [localhost]
            labels:
              namespace: parcial-celc
              app: app1
              __path__: /var/log/pods/parcial-celc_app1-*/*/*.log
          - targets: [localhost]
            labels:
              namespace: parcial-celc
              app: app2
              __path__: /var/log/pods/parcial-celc_app2-*/*/*.log
          - targets: [localhost]
            labels:
              namespace: parcial-celc
              app: app3
              __path__: /var/log/pods/parcial-celc_app3-*/*/*.log
          - targets: [localhost]
            labels:
              namespace: parcial-celc
              app: app4
              __path__: /var/log/pods/parcial-celc_app4-*/*/*.log
          - targets: [localhost]
            labels:
              namespace: traefik
              app: traefik
              __path__: /var/log/pods/traefik_traefik-*/*/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring-celc
  labels:
    app.kubernetes.io/name: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
    spec:
      serviceAccountName: promtail
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:3.6.0
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - name: http
              containerPort: 9080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
        - name: pods
          hostPath:
            path: /var/log/pods