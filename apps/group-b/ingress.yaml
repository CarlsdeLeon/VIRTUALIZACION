apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-group-b
  namespace: parcial-celc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app3.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3-svc
                port:
                  name: http
    - host: app4.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app4-svc
                port:
                  name: http