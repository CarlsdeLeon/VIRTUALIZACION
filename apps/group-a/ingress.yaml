apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-group-a
  namespace: parcial-celc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app1.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-svc
                port:
                  name: http
    - host: app2.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2-svc
                port:
                  name: http