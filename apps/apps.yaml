apiVersion: v1
kind: Namespace
metadata:
  name: parcial-celc
---
# ---------- APP 1: whoami ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: app1-whoami, namespace: parcial-celc }
spec:
  replicas: 1
  selector: { matchLabels: { app: app1 } }
  template:
    metadata: { labels: { app: app1 } }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: app1-svc, namespace: parcial-celc }
spec:
  selector: { app: app1 }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------- APP 2: nginx hello ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: app2-hello, namespace: parcial-celc }
spec:
  replicas: 1
  selector: { matchLabels: { app: app2 } }
  template:
    metadata: { labels: { app: app2 } }
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: app2-svc, namespace: parcial-celc }
spec:
  selector: { app: app2 }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------- APP 3: httpd ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: app3-httpd, namespace: parcial-celc }
spec:
  replicas: 1
  selector: { matchLabels: { app: app3 } }
  template:
    metadata: { labels: { app: app3 } }
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: app3-svc, namespace: parcial-celc }
spec:
  selector: { app: app3 }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------- APP 4: http-echo ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: app4-echo, namespace: parcial-celc }
spec:
  replicas: 1
  selector: { matchLabels: { app: app4 } }
  template:
    metadata: { labels: { app: app4 } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo
          args: ["-text=Hola desde la app 4 - parcial-celc"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: app4-svc, namespace: parcial-celc }
spec:
  selector: { app: app4 }
  ports: [{ port: 80, targetPort: 5678 }]
---
# ---------- INGRESS (Traefik) ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: parcial-celc
spec:
  ingressClassName: traefik
  rules:
    - host: app1.parcial.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: app1-svc, port: { number: 80 } } } }
    - host: app2.parcial.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: app2-svc, port: { number: 80 } } } }
    - host: app3.parcial.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: app3-svc, port: { number: 80 } } } }
    - host: app4.parcial.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: app4-svc, port: { number: 80 } } } }