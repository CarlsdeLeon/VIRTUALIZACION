  type: ClusterIP
  selector:
    app: app3
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ---------- APP 4: http-echo ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4-echo
  namespace: parcial-celc
  labels:
    app.kubernetes.io/name: app4
    app.kubernetes.io/part-of: parcial-02
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app4
  template:
    metadata:
      labels:
        app: app4
        app.kubernetes.io/name: app4
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - "-text=Hola desde la app 4 - parcial-celc"
          ports:
            - name: http
              containerPort: 5678
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app4-svc
  namespace: parcial-celc
  labels:
    app.kubernetes.io/name: app4
spec:
  type: ClusterIP
  selector:
    app: app4
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ---------- INGRESS (Traefik) ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: parcial-celc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app1.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-svc
                port:
                  name: http
    - host: app2.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2-svc
                port:
                  name: http
    - host: app3.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3-svc
                port:
                  name: http
    - host: app4.parcial.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app4-svc
                port:
                  name: http