---
# ---------- APP 3: httpd ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-httpd
  namespace: parcial-celc
  labels:
    app.kubernetes.io/name: app3
    app.kubernetes.io/part-of: parcial-02
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
        app.kubernetes.io/name: app3
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
